[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-jev"
version = "0.1.0.dev0"
description = "Open visual dynamic-candidate decision model and reproducible training tutorial"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Vision-JEV Contributors"}]
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.7",
  "transformers>=4.55",
  "accelerate>=1.8",
  "peft>=0.16",
  "safetensors>=0.5",
  "pillow>=11",
  "numpy>=2.0",
]
rl = ["gymnasium>=1.2", "minigrid>=3.0"]
data = [
  "datasets>=4.0",
  "pillow>=11",
  "pyarrow>=20",
  "pandas>=2.2",
  "tfrecord>=1.14",
  "android-env==1.3.0",
  "weblinx>=0.3",
]
dev = ["pytest>=8.3", "ruff>=0.12", "mypy>=1.16", "pre-commit>=4.2"]

[project.scripts]
vision-jev = "vision_jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vision_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gpu: requires CUDA", "model: requires model weights", "slow: long-running"]
